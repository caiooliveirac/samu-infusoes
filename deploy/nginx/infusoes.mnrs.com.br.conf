# infusoes.mnrs.com.br — site estático (calculadora de infusões do SAMU).
# Atrás do Cloudflare (proxied, cert de origem). Sem backend, sem porta: o nginx
# serve direto /var/www/infusoes/current, um symlink trocado atomicamente pelo
# deploy (deploy/publish.sh → deploy/activate.sh). server_name exato tem precedência sobre o
# wildcard *.mnrs.com.br de mnrs.conf.
#
# Aplicar no magalu (uma vez, ou quando este arquivo mudar):
#   sudo cp ~/infusoes-nginx.conf /etc/nginx/sites-available/infusoes.mnrs.com.br.conf
#   sudo ln -sfn /etc/nginx/sites-available/infusoes.mnrs.com.br.conf /etc/nginx/sites-enabled/infusoes.mnrs.com.br.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Backup de config NUNCA dentro de sites-enabled/ (nginx carrega tudo lá).
server {
    listen 443 ssl http2;
    server_name infusoes.mnrs.com.br;
    ssl_certificate     /etc/ssl/cloudflare/mnrs.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mnrs.key;

    root /var/www/infusoes/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Assets do Vite têm hash no nome: cache longo e imutável.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # index.html revalida sempre para pegar o deploy novo.
    location = /index.html { add_header Cache-Control "no-cache"; }
    # PWA: service worker e manifest também revalidam, senão o app instalado
    # fica preso numa versão antiga.
    location ~ ^/(sw\.js|registerSW\.js)$ { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location = /healthz { default_type text/plain; add_header Cache-Control "no-store"; try_files /healthz =404; }
    location / { try_files $uri $uri/ /index.html; }
}
